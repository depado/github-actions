name: Docker

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner to use for the job"
        required: false
        type: string
        default: "ubuntu-latest"
      dockerfile:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: "Dockerfile"
      target:
        description: "Dockerfile build target stage"
        required: false
        type: string
        default: ""
      context:
        description: "Build context path"
        required: false
        type: string
        default: "."
      platforms:
        description: "Comma-separated list of platforms for buildx (enables buildx automatically)"
        required: false
        type: string
        default: ""

      security-scan:
        description: "Enable container security scanning"
        required: false
        type: boolean
        default: true
      scan-severity:
        description: "Minimum severity for security scan (UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL)"
        required: false
        type: string
        default: "CRITICAL"

      enable-cleanup:
        description: "Enable cleanup of untagged container images"
        required: false
        type: boolean
        default: true
      cleanup-cut-off:
        description: "Minimum age for untagged images to be deleted (e.g., 1d for 1 day)"
        required: false
        type: string
        default: "1d"
      cleanup-account:
        description: "Account type for package cleanup: an org name, or 'user' for a personal account"
        required: false
        type: string
        default: "user"

      tag-suffix:
        description: 'Suffix to append to image tags (e.g., "-packed")'
        required: false
        type: string
        default: ""
      tag-latest:
        description: "Enable latest tag for this build"
        required: false
        type: boolean
        default: true

      cache:
        description: "Enable GitHub Actions cache for Docker build"
        required: false
        type: boolean
        default: true

jobs:
  docker:
    name: "Build"
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && inputs.tag-latest }}
          flavor: |
            latest=false
            suffix=${{ inputs.tag-suffix }}

      - name: Set up Docker Buildx
        if: inputs.platforms != '' || inputs.cache
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ inputs.platforms }}
          target: ${{ inputs.target }}
          provenance: false
          cache-from: ${{ inputs.cache && 'type=gha' || '' }}
          cache-to: ${{ inputs.cache && 'type=gha,mode=max' || '' }}

      - name: Run Trivy vulnerability scanner
        if: inputs.security-scan && github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DISABLE_VEX_NOTICE: true
        with:
          scan-type: "image"
          scan-ref: ${{ format('ghcr.io/{0}:{1}', github.repository, steps.meta.outputs.version) }}
          format: "table"
          severity: ${{ inputs.scan-severity }}
          exit-code: "1"
          output: "trivy-results.txt"

      - name: Display scan results
        if: inputs.security-scan && github.event_name != 'pull_request' && always()
        run: |
          echo "## 🔍 Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat trivy-results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Delete untagged container images
        if: github.event_name != 'pull_request' && inputs.enable-cleanup
        uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53 # v3.1.0
        with:
          account: ${{ inputs.cleanup-account }}
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: ${{ github.event.repository.name }}
          tag-selection: untagged
          cut-off: ${{ inputs.cleanup-cut-off }}
